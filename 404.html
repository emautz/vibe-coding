<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <style>
        /* =========================================================
           v1.0 - Custom 404 page
           Dark tech / tattoo-inspired design
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #080808;
            --card: #111111;
            --text: #f5f5f5;
            --muted: #a7a7a7;
            --accent: #d7d7d7;
            --border: #333333;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #181818 0%, #080808 55%, #030303 100%);
            color: var(--text);
            font-family: "Courier New", Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        /* Subtle grid gives the page a tech-inspired background. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 35px 35px;
            pointer-events: none;
        }

        main {
            position: relative;
            width: min(700px, 100%);
            text-align: center;
            padding: clamp(35px, 7vw, 70px) 25px;
            border: 1px solid var(--border);
            background: rgba(10, 10, 10, 0.92);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.04);
        }

        /* Decorative tattoo/metal-inspired corner accents. */
        .corner {
            position: absolute;
            font-size: 1.4rem;
            color: #777;
            user-select: none;
        }

        .corner.top-left {
            top: 14px;
            left: 18px;
        }

        .corner.top-right {
            top: 14px;
            right: 18px;
        }

        .corner.bottom-left {
            bottom: 14px;
            left: 18px;
        }

        .corner.bottom-right {
            bottom: 14px;
            right: 18px;
        }

        .error-code {
            font-size: clamp(5rem, 18vw, 10rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -8px;
            color: transparent;
            -webkit-text-stroke: 2px #eeeeee;
            text-shadow:
                4px 4px 0 #333333,
                8px 8px 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 25px;
        }

        .system-message {
            color: #777;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 18px;
            line-height: 1.2;
        }

        p {
            color: var(--muted);
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            line-height: 1.7;
            margin: 0 auto 30px;
            max-width: 520px;
        }

        .home-link {
            display: inline-block;
            color: #080808;
            background: #f2f2f2;
            text-decoration: none;
            font-weight: bold;
            padding: 14px 22px;
            border: 2px solid #f2f2f2;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .home-link:hover {
            background: transparent;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.12);
        }

        .home-link:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 5px;
        }

        .status {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #666;
        }

        .cursor {
            display: inline-block;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Respect visitors who prefer reduced motion. */
        @media (prefers-reduced-motion: reduce) {
            .cursor {
                animation: none;
            }

            .home-link {
                transition: none;
            }
        }

        /* Small-screen adjustments. */
        @media (max-width: 500px) {
            main {
                padding: 50px 20px;
            }

            .error-code {
                letter-spacing: -4px;
            }

            .home-link {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main aria-labelledby="error-title">

        <!-- Decorative symbols are hidden from screen readers. -->
        <span class="corner top-left" aria-hidden="true">✦</span>
        <span class="corner top-right" aria-hidden="true">🗡</span>
        <span class="corner bottom-left" aria-hidden="true">◆</span>
        <span class="corner bottom-right" aria-hidden="true">✦</span>

        <div class="system-message" aria-hidden="true">
            system://page-not-found
        </div>

        <div class="error-code" aria-hidden="true">
            404
        </div>

        <h1 id="error-title">
            Whoops! Something happened!
        </h1>

        <p>
            The page you're looking for couldn't be found.
            Here's the link to the home page:
        </p>

        <a
            class="home-link"
            href="https://emautz.github.io/vibe-coding/"
            aria-label="Return to Elizabeth Mautz's home page"
        >
            ← Return Home
        </a>

        <div class="status" aria-hidden="true">
            &gt; error: page not found<br>
            &gt; recovery option detected<span class="cursor">_</span>
        </div>

    </main>

    <script>
        // =========================================================
        // v1.0 - Initial JavaScript
        // =========================================================

        /*
         * This page does not need JavaScript to function.
         *
         * The home-page link is a normal HTML link, which means it
         * will still work even if JavaScript is disabled.
         *
         * This script is intentionally kept small because the 404
         * page should load quickly and reliably if a visitor reaches
         * a URL that does not exist.
         */

        // Wait until the HTML page has completely loaded before
        // running any JavaScript.
        document.addEventListener("DOMContentLoaded", function () {

            /*
             * Find the Return Home link on the page.
             *
             * We store it in a variable so additional behavior could
             * easily be added later without changing the HTML.
             */
            const homeLink = document.querySelector(".home-link");

            /*
             * This check confirms that the link exists before trying
             * to work with it. This prevents JavaScript errors if the
             * HTML is changed in the future.
             */
            if (homeLink) {

                /*
                 * Add an accessible title that appears as a tooltip
                 * for mouse users and provides another description
                 * of where the link goes.
                 */
                homeLink.setAttribute(
                    "title",
                    "Go back to the Vibe Coding home page"
                );
            }
        });
    </script>

</body>
</html>
