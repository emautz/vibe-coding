<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    /* CSS Styles for the dark moody aesthetic */
    
    /* Reset defaults and set dark background with soft radial gradient */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0f12;
      background: radial-gradient(circle at center, #171b21 0%, #08090b 100%);
      color: #e6e8ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Central container */
    .container {
      text-align: center;
      max-width: 650px;
      padding: 2rem;
      animation: fadeIn 1.2s ease-in-out;
    }

    /* Clock styling */
    .clock-display {
      font-size: 4.5rem;
      font-weight: 200;
      letter-spacing: 0.05em;
      color: #f0f2f5;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      margin-bottom: 0.2rem;
      font-variant-numeric: tabular-nums;
    }

    /* Date display styling */
    .date-display {
      font-size: 1.1rem;
      font-weight: 300;
      color: #8c96a3;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
    }

    /* Greeting styling */
    .greeting {
      font-size: 1.8rem;
      font-weight: 400;
      color: #c5cbd3;
      margin-bottom: 3rem;
      letter-spacing: 0.02em;
    }

    /* Navigation grid for quick links */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      list-style: none;
      padding: 0;
    }

    /* Individual link buttons */
    .link-item a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.2rem;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      color: #a3acb9;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      transition: all 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Subtle hover and focus effects */
    .link-item a:hover {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* Keyboard focus ring for accessibility */
    .link-item a:focus-visible {
      outline: 2px solid #6b82a8;
      outline-offset: 3px;
      color: #ffffff;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Main container element marked as main content landmark for accessibility -->
  <main class="container" role="main">
    
    <!-- Time display element -->
    <div id="clock" class="clock-display" aria-label="Current time"></div>

    <!-- Date display element -->
    <div id="date" class="date-display" aria-label="Current date"></div>

    <!-- Personal greeting element -->
    <h1 class="greeting">Elizabeth Mautz</h1>

    <!-- Navigation container containing the six customizable links -->
    <nav aria-label="Quick Links Navigation">
      <ul id="links-container" class="quick-links"></ul>
    </nav>

  </main>

  <!-- External JS file loaded at the end of body -->
  <script src="newtab.js"></script>
</body>
</html>
